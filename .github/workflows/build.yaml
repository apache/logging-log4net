name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:

  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # 4.1.7

      - name: Set up dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # 6.0.0
        with:
          dotnet-version: 10
          dotnet-quality: ga

      - name: Build
        run: |
            dotnet build ./src/log4net.sln

      - name: Test
        run: |
            dotnet test ./src/log4net.sln

      # Pester 5.9 ships on all three runner images, so nothing is installed here.
      - name: Release script tests
        shell: pwsh
        run: |
            $result = Invoke-Pester ./scripts/verify-release.Tests.ps1 -Output Detailed -PassThru
            if ($result.FailedCount -ne 0) { exit 1 }

      # Runs the same probes twice, JIT compiled and published with Native AOT, so that a
      # difference between the two is caused by AOT rather than by the platform. The project
      # knows which probes are expected to fail in each mode and exits non-zero when reality
      # does not match, in either direction.
      - name: AOT probes
        shell: pwsh
        env:
          "log4net.AotEnvironmentProbe": from-environment
        run: |
            dotnet run --project ./src/log4net.Tests.Aot/log4net.Tests.Aot.csproj -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet publish ./src/log4net.Tests.Aot/log4net.Tests.Aot.csproj -c Release -o ./aot-probes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./aot-probes/log4net.Tests.Aot$($IsWindows ? '.exe' : '')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A process that hosts the runtime natively has no entry assembly, so the configuration
      # system cannot work out where the config file is (issue #162). The check owns the process
      # from its first statement, because the configuration system caches its initialization and
      # log4net reads its first setting from a static constructor, so it cannot be one of the
      # probes above.
      #
      # JIT only, deliberately: under Native AOT the configuration system is trimmed away, so the
      # first setting read fails as a missing constructor long before it can fail for want of an
      # entry assembly. The published executable passes this check with the fix reverted, which
      # makes it a green that cannot fail for the reason the check exists.
      - name: AOT probes, no entry assembly
        shell: pwsh
        run: |
            dotnet run --project ./src/log4net.Tests.Aot/log4net.Tests.Aot.csproj -c Release -- --no-entry-assembly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }